    </g>
    <text x="100" y="51" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="46" font-weight="800" fill="#ffffff">BountyLens</text>

    <text x="0" y="190" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="62" font-weight="800" fill="#ffffff">
      <tspan x="0" dy="0">Find GitHub bounty</tspan>
      <tspan x="0" dy="68">issues faster</tspan>
    </text>
    <text x="0" y="360" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="25" font-weight="650" fill="#ffffff" opacity="0.92">
