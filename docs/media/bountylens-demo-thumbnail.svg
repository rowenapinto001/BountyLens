        <path d="M25 34 c-8 -2 -9 -10 -5 -15 1 -7 14 -7 20 0 4 5 3 13 -5 15" fill="#18234a"/>
        <text x="62" y="25" font-size="15" font-weight="800" fill="#111a44">zerocost/bounty-issues - #42</text>
        <text x="62" y="43" font-size="12" font-weight="650" fill="#66708c">Updated 18m ago - 1 comment</text>
        <rect x="306" y="13" width="42" height="28" rx="8" fill="#ffffff" stroke="#d8deea"/>
        <path d="M322 20 v15 l5 -3 5 3 v-15z" fill="none" stroke="#66708c" stroke-width="2" stroke-linejoin="round"/>
