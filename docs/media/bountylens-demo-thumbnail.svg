        <circle cx="30" cy="27" r="18" fill="#f1efff"/>
        <path d="M25 34 c-8 -2 -9 -10 -5 -15 1 -7 14 -7 20 0 4 5 3 13 -5 15" fill="#18234a"/>
        <text x="62" y="25" font-size="15" font-weight="800" fill="#111a44">agent-bounties/api - #128</text>
        <text x="62" y="43" font-size="12" font-weight="650" fill="#66708c">Updated 24m ago - 2 comments</text>
