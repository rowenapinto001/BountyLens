        <circle cx="25" cy="25" r="18" fill="#facc15" stroke="#b7791f" stroke-width="2"/>
        <text x="25" y="35" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="30" font-weight="800" fill="#92400e">$</text>
        <path d="M37 38 L55 56" stroke="#7dd3fc" stroke-width="7" stroke-linecap="round"/>
        <circle cx="25" cy="25" r="26" fill="none" stroke="#8b7cff" stroke-width="7"/>
