<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">BountyLens demo thumbnail</title>
  <desc id="desc">A purple and pink promotional thumbnail for the BountyLens Chrome side-panel extension.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e64f9c"/>
      <stop offset="0.54" stop-color="#6d3ce7"/>
      <stop offset="1" stop-color="#5146e5"/>
    </linearGradient>
    <radialGradient id="shine" cx="18%" cy="14%" r="40%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5746e8"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#140a4d" flood-opacity="0.34"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#18234a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1280" height="800" fill="url(#brand)"/>
  <rect width="1280" height="800" fill="url(#shine)"/>
  <circle cx="118" cy="104" r="160" fill="#ffffff" opacity="0.08"/>
  <circle cx="1118" cy="668" r="220" fill="#ffffff" opacity="0.07"/>

  <g transform="translate(72 118)">
    <g transform="translate(0 0)">
      <rect width="76" height="76" rx="22" fill="#ffffff" opacity="0.18" stroke="#ffffff" stroke-opacity="0.55"/>
      <g transform="translate(13 13)">
