        <path d="M25 34 c-8 -2 -9 -10 -5 -15 1 -7 14 -7 20 0 4 5 3 13 -5 15" fill="#18234a"/>
        <text x="62" y="25" font-size="15" font-weight="800" fill="#111a44">oss-rewards/starter - #73</text>
