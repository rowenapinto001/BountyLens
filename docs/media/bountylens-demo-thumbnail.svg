      <tspan x="0" dy="38">"bounty", ranked for your experience level.</tspan>
    </text>

    <g transform="translate(0 450)" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="750" fill="#ffffff">
      <rect width="190" height="46" rx="23" fill="#ffffff" opacity="0.16" stroke="#ffffff" stroke-opacity="0.55"/>
      <text x="95" y="30" text-anchor="middle">Fewest comments first</text>
      <rect x="206" width="138" height="46" rx="23" fill="#ffffff" opacity="0.16" stroke="#ffffff" stroke-opacity="0.55"/>
      <text x="275" y="30" text-anchor="middle">Save later</text>
